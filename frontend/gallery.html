<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    姓名：闫雨桐 | 学号：24001010730 | 时间：2026-11-19 | 大模型：Tencent Hunyuan Hy
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文列表 · 知乎的模仿与制作</title>
  <link rel="stylesheet" href="css/yyt_style.css">
</head>
<body>
  <canvas id="yytCanvas" class="yyt-canvas" aria-hidden="true"></canvas>

  <div class="yyt-page">
    <header class="yyt-header">
      <div class="yyt-brand">
        <div class="yyt-logo">知</div>
        <div class="yyt-brand-text">
          <h1 class="yyt-title">图文列表</h1>
          <p class="yyt-subtitle">Image Gallery · 数据来自 MySQL</p>
        </div>
      </div>
      <div class="yyt-meta">
        <a class="yyt-meta-item yyt-link" href="index.html">返回首页</a>
        <span class="yyt-meta-item yyt-badge">项目类别：模仿</span>
      </div>
    </header>

    <main class="yyt-main">
      <section class="yyt-api-card">
        <div class="yyt-api-head">
          <span class="yyt-api-tag">后端接口</span>
          <span id="yytApiStatus" class="yyt-api-status">请求中...</span>
        </div>
        <div class="yyt-api-line">
          <span class="yyt-api-method">GET</span>
          <a id="yytApiLink" class="yyt-api-url" href="/api/gallery" target="_blank">/api/gallery</a>
        </div>
        <p class="yyt-api-desc">页面数据由该接口从 MySQL 表 <code>yyt_image_gallery</code> 读取，点击链接可查看原始 JSON。</p>
      </section>

      <section class="yyt-news-section">
        <div class="yyt-section-head">
          <h2 class="yyt-section-title">图文列表</h2>
          <span id="yytGalleryCount" class="yyt-section-hint">加载中...</span>
        </div>
        <div id="yytGalleryList" class="yyt-gallery-list"></div>
        <div id="yytGalleryMessage" class="yyt-result" role="status" aria-live="polite"></div>
      </section>
    </main>

    <footer class="yyt-footer">
      <span>闫雨桐 · 24001010730</span>
      <span>知乎的模仿与制作 · 模仿类项目</span>
    </footer>
  </div>

  <script src="js/yyt_main.js"></script>
  <script src="js/yyt_gallery.js"></script>
</body>
</html>
